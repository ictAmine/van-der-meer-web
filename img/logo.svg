<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 30 460 370" width="100%" height="100%">
    <!-- Fondo transparente -->
    <g stroke="#D4AF37" stroke-width="2.5" fill="none" stroke-linejoin="round">
        <!-- Casa (Zaanse Gevel) -->
        <path d="M 250 60 L 265 75 L 265 95 L 290 95 L 290 120 L 315 120 L 315 150 L 335 150 L 335 280 L 165 280 L 165 150 L 185 150 L 185 120 L 210 120 L 210 95 L 235 95 L 235 75 Z"/>
        <!-- Detalles -->
        <circle cx="250" cy="45" r="5" fill="#D4AF37"/>
        <line x1="250" y1="50" x2="250" y2="60"/>
        
        <!-- Ventanas Superiores -->
        <rect x="235" y="105" width="30" height="35"/>
        <line x1="235" y1="122.5" x2="265" y2="122.5"/>
        <line x1="250" y1="105" x2="250" y2="140"/>
        
        <!-- Ventanas Centrales -->
        <rect x="180" y="160" width="30" height="40"/>
        <line x1="180" y1="180" x2="210" y2="180"/><line x1="195" y1="160" x2="195" y2="200"/>
        <rect x="235" y="160" width="30" height="40"/>
        <line x1="235" y1="180" x2="265" y2="180"/><line x1="250" y1="160" x2="250" y2="200"/>
        <rect x="290" y="160" width="30" height="40"/>
        <line x1="290" y1="180" x2="320" y2="180"/><line x1="305" y1="160" x2="305" y2="200"/>
        
        <!-- Ventanas Inferiores y Puerta -->
        <rect x="180" y="220" width="30" height="40"/>
        <line x1="180" y1="240" x2="210" y2="240"/><line x1="195" y1="220" x2="195" y2="260"/>
        <rect x="290" y="220" width="30" height="40"/>
        <line x1="290" y1="240" x2="320" y2="240"/><line x1="305" y1="220" x2="305" y2="260"/>
        <rect x="235" y="220" width="30" height="60"/>
        <circle cx="260" cy="250" r="1.5" fill="#D4AF37"/>
        
        <!-- Línea de suelo -->
        <line x1="130" y1="280" x2="370" y2="280"/>
    </g>
    
    <!-- Tipografía engrandecida -->
    <text x="250" y="325" font-family="'Cinzel', serif" font-size="46" font-weight="700" fill="#D4AF37" text-anchor="middle">VAN DER MEER</text>
    <text x="250" y="360" font-family="'Cinzel', serif" font-size="28" fill="#D4AF37" text-anchor="middle" letter-spacing="2">DIENSTENGROEP</text>
    
    <!-- Slogan resaltado -->
    <text x="250" y="385" font-family="'Montserrat', sans-serif" font-size="13" font-weight="600" fill="rgba(212, 175, 55, 0.9)" text-anchor="middle" letter-spacing="3">RESTAURATIE • BOUW &amp; ONDERHOUD</text>
</svg>